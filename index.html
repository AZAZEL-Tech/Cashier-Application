<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="WarungKu POS - Aplikasi Kasir dan Pengelolaan Toko / Warung Modern untuk PC & Smartphone (Android/iOS)." />
  
  <title>WarungKu POS - Kasir & Pengelolaan Toko Modern</title>

  <!-- Google Fonts (Plus Jakarta Sans & JetBrains Mono) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Chart.js for Admin Analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- QRCode.js for QRIS Generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- Custom CSS & Print Thermal Layout -->
  <link rel="stylesheet" href="css/style.css?v=2.6" />

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23059669' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z'></path><polyline points='9 22 9 12 15 12 15 22'></polyline></svg>" />
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen antialiased selection:bg-emerald-500 selection:text-white">

  <!-- Application Mount Container -->
  <div id="app-root"></div>

  <!-- Application Logic Scripts -->
  <script src="js/data.js?v=2.7"></script>
  <script src="js/store.js?v=2.7"></script>
  <script src="js/components/navbar.js?v=2.7"></script>
  <script src="js/components/pos.js?v=2.7"></script>
  <script src="js/components/modals.js?v=2.7"></script>
  <script src="js/components/admin-dashboard.js?v=2.7"></script>
  <script src="js/components/admin-products.js?v=2.7"></script>
  <script src="js/components/admin-discounts.js?v=2.7"></script>
  <script src="js/components/admin-finance.js?v=2.7"></script>
  <script src="js/components/admin-transactions.js?v=2.7"></script>
  <script src="js/components/admin-settings.js?v=2.7"></script>
  <script src="js/app.js?v=2.7"></script>

  <!-- Service Worker Registration for PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => {
          console.log('SW registration skipped or error:', err);
        });
      });
    }
  </script>
</body>
</html>
